spring.application.name=wedding-checkin-test

# DB H2 in memoria per i test: non tocca mai il file data/weddingdb.mv.db
# usato dall'app vera, cosi' i test non rischiano di cancellare dati reali.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# PIN usato dai test per le operazioni protette (deve combaciare con quello
# atteso in GuestControllerTest).
staff.pin=1234
