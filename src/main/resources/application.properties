spring.application.name=wedding-checkin

# Database H2 su file, cosi' i dati sopravvivono al riavvio dell'app
spring.datasource.url=jdbc:h2:file:./data/weddingdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Accessibile da altri dispositivi sulla stessa rete WiFi (telefoni/tablet allo scan)
server.address=0.0.0.0
server.port=8443

# HTTPS con certificato self-signed: OBBLIGATORIO per usare la fotocamera dai
# telefoni. I browser mobili negano l'accesso a camera/microfono (getUserMedia)
# su origini non sicure: un URL http://192.168.x.x:8080 aperto da telefono
# farebbe fallire "Avvia fotocamera" in silenzio o con un errore di permessi.
# Al primo accesso da ogni telefono, il browser mostrera' un avviso perche' il
# certificato e' self-signed (non emesso da un'autorita' riconosciuta): e'
# normale, basta scegliere "Avanzate" -> "Procedi comunque" una sola volta.
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=wedding2026
server.ssl.key-alias=weddingcheckin

# PIN richiesto allo staff per importare la lista invitati, azzerare i check-in
# o forzare un ingresso duplicato. Senza questo controllo chiunque sulla stessa
# WiFi potrebbe azzerare tutti gli ingressi. CAMBIALO prima dell'evento!
staff.pin=2026
